# Lifecycle methods have no @Timeout: a class-level @Timeout covers testable methods only, never
# @BeforeAll/@BeforeEach -- so the Spring context boot and the shared-home reset of FactorySpringTest
# were unbounded. This is the net for those; a test method's own @Timeout stays untouched by it.
# Measured (JUnit 6.0.3): a sleeping @BeforeAll is interrupted by this limit; a lifecycle method that
# ignores interrupts would still run on.
junit.jupiter.execution.timeout.lifecycle.method.default=120s
