<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="./atom-one-light.min.css">
    <link rel="stylesheet" href="./diff2html.min.css">

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            color: #1a1a1a;
            background: #fff;
        }

        p {
            margin: 4px;
        }

        .message {
            padding: 2px 8px 4px 8px;
        }

        /* Role label */
        .message::before {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        /* Role-specific styling */
        .message.USER::before {
            content: "You";
            color: #0969da;
        }

        .message.USER {
            border-left: 3px solid #0969da;
            padding-left: 8px;
        }

        .message.AI {
            border-left: 3px solid #1a7f37;
        }

        .message.AI::before {
            content: "Peon";
            color: #1a7f37;
        }

        .message.diff {
            border-left: 3px solid #1a7f37;
        }

        .message.TOOL,
        .message.THINK {
            font-size: 11px;
            font-style: italic;
            color: #888;
            border-left: 3px solid #ccc;
            padding-left: 12px;
        }

        .message.TOOL::before {
            content: "Tool";
            color: #999;
        }

        .message.THINK::before {
            content: "Thinking";
            color: #999;
        }

        .message.PROBLEM {
            color: #d32f2f;
            border-left: 3px solid #d32f2f;
        }

        .message.PROBLEM::before {
            content: "Problem";
            color: #d32f2f;
        }

        .message.QUESTION {
            border-left: 3px solid #d29922;
        }

        .message.QUESTION::before {
            content: "Question";
            color: #d29922;
        }

        .code-pre {
            position: relative;
        }

        .copy-btn {
            position: absolute;
            top: 4px;
            right: 2px;
            z-index: 10;
            padding: 2px;
            border: none;
            background: transparent;
            cursor: pointer;
            line-height: 0;
            opacity: 0.8;
        }

        .copy-btn:hover {
            color: #0969da;
            opacity: 1;
        }

        .copy-btn.copied {
            color: #1a7f37;
            opacity: 1;
        }

        @keyframes blink-cursor {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0; }
        }

        #live-status {
            display: none;
            position: sticky;
            bottom: 0;
            background: rgba(15, 20, 32, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-top: 1px solid rgba(78, 160, 180, 0.3);
            padding: 5px 10px;
            font-size: 11px;
            color: #a8c4cc;
            font-family: 'Cascadia Code', 'Fira Code', 'Menlo', monospace;
        }

        .live-state {
            font-style: normal;
            color: #7ec8d4;
        }

        .live-state::after {
            content: "▊";
            font-size: 10px;
            color: #4da8b8;
            animation: blink-cursor 1s step-end infinite;
            margin-left: 4px;
        }

        /* chunk exists → hide the state cursor */
        .live-state:has(+ .live-chunk)::after {
            display: none;
        }
        .live-chunk {
            margin-top: 2px;
            font-size: 10.5px;
            color: #7a9aa4;
            font-style: italic;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .live-chunk::after {
            content: "▊";
            font-size: 10px;
            color: #7a9aa4;
            animation: blink-cursor 1s step-end infinite;
            margin-left: 4px;
        }

        .message.diff .d2h-file-name {
            cursor: pointer;
            color: #0969da;
            text-decoration: underline;
        }

        .message.diff .d2h-file-name:hover {
            text-decoration: none;
        }
    </style>

    <script src="./highlight.min.js"></script>
    <script src="./lang/css.min.js"></script>
    <script src="./lang/elixir.min.js"></script>
    <script src="./lang/ini.min.js"></script>

    <script src="./lang/php.min.js"></script>

    <script src="./lang/ruby.min.js"></script>

    <script src="./lang/scss.min.js"></script>

    <script src="./lang/typescript.min.js"></script>

    <script>
        const COPY_ICON = `
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     width="20"
     height="20"
     fill="currentColor"
     aria-hidden="true">
  <path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z"/>
</svg>`;

        const md = window.markdownit({
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return '<pre class="code-pre"><code class="hljs">' +
                            hljs.highlight(str, {language: lang, ignoreIllegals: true}).value +
                            '</code>' +
                            '<button class="copy-btn">' + COPY_ICON + '</button>' +
                            '</pre>';
                    } catch (__) { }
                }

                return '<pre><code class="hljs">' + md.utils.escapeHtml(str) + '</code></pre>';
            },
        });

        // Detect workspace links — false for URLs with schemes (https://, mailto:, etc.)
        function isWorkspaceLink(href) {
            return !href.includes('://');
        }

        // Convert workspace file links to open-in-editor: protocol
        md.renderer.rules.link_open = function(tokens, idx, options, env, self) {
            const token = tokens[idx];
            const hrefAttr = token.attrs.find(a => a[0] === 'href');
            if (hrefAttr && isWorkspaceLink(hrefAttr[1])) {
                hrefAttr[1] = 'open-in-editor:' + encodeURIComponent(hrefAttr[1]);
            }
            return self.renderToken(tokens, idx, options, env);
        };
        function toolMessage(message) {
            if (!message) return;
            const container = document.getElementById("chat");
            const last = container.lastElementChild;
            if (last && last.classList.contains('TOOL')) {
                const lines = last.innerHTML.split('<br>').filter(l => l.trim());
                lines.push(message);
                if (lines.length > 10) lines.splice(0, lines.length - 10);
                last.innerHTML = lines.join('<br>');
            } else {
                const div = document.createElement("div");
                div.className = "message TOOL";
                div.innerHTML = message;
                container.appendChild(div);
            }
            window.scrollTo(0, document.body.scrollHeight);
        }



        function updateLiveResponse(stateMessage, tokPerSec, thinkChunk) {
            var el = document.getElementById("live-status");
            if (!el) {
                el = document.createElement("div");
                el.id = "live-status";
                document.body.appendChild(el);
            }
            var rate = tokPerSec > 0 ? " | " + tokPerSec.toFixed(1) + " tok/s" : "";
            var textWithBr = (thinkChunk && thinkChunk !== "null")
                ? thinkChunk.replace(/\r\n/g, '<br>').replace(/\n/g, '<br>')
                : "";
            var chunk = textWithBr ? "<div class='live-chunk'>" + textWithBr + "</div>" : "";
            el.innerHTML = "<span class='live-state'>" + stateMessage + rate + "</span>" + chunk;

            var wasHidden = (el.style.display !== "block");
            el.style.display = "block";

            if (textWithBr) {
                var chunkEl = el.querySelector('.live-chunk');
                if (chunkEl) {
                    chunkEl.scrollTop = chunkEl.scrollHeight;
                }
            }

            // Scroll page to bottom after live preview becomes visible
            if (wasHidden) {
                window.scrollTo(0, document.body.scrollHeight);
            }
        }

        function hideLiveStatus() {
            var el = document.getElementById("live-status");
            if (el) el.style.display = "none";
        }

        function appendMessage(message) {
            hideLiveStatus();
            if (message.role === 'TOOL') {toolMessage(message.message); return;}
            const container = document.getElementById("chat");
            const lastMessage = container.lastElementChild;
            if (lastMessage && lastMessage.classList.contains(message.role)) {
                lastMessage.insertAdjacentHTML('beforeend', md.render(message.message ?? ""));
            } else {
                const div = document.createElement("div");
                div.className = "message " + message.role;
                div.innerHTML = md.render(message.message ?? "");
                container.appendChild(div);
            }
            window.scrollTo(0, document.body.scrollHeight);
        }
        
        document.addEventListener("click", e => {
            const name = e.target.closest(".d2h-file-name");
            if (name) {
                const path = (name.textContent || "").trim();
                if (path) window.location.href = "open-in-editor:" + encodeURIComponent(path);
                return;
            }
            const btn = e.target.closest(".copy-btn");
            if (!btn) return;
            const code = btn.closest(".code-pre")?.querySelector(".hljs");
            if (!code) return;
            const text = code.innerText;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    btn.classList.add('copied');
                    setTimeout(() => btn.classList.remove('copied'), 1500);
                }).catch(err => toolMessage('Failed to copy: ' + err));
            } else {
                // Fallback for Eclipse WebView / file://
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;opacity:0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    btn.classList.add('copied');
                    setTimeout(() => btn.classList.remove('copied'), 1500);
                } catch (err) {
                    toolMessage('Failed to copy: ' + err);
                } finally {
                    document.body.removeChild(ta);
                }
            }
        });

        function appendDiff(diffString) {
            hideLiveStatus();
            const container = document.getElementById("chat");
            const div = document.createElement("div");
            div.className = "message diff";
            container.appendChild(div);

            var diff2htmlUi = new Diff2HtmlUI(div, diffString, {
                drawFileList: false,
                outputFormat: 'line-by-line',
                highlight: true,
                matching: 'lines'
            });
            diff2htmlUi.draw();
            window.scrollTo(0, document.body.scrollHeight);
        }

        function clearMessages() {
            document.getElementById("chat").innerHTML = "";
        }

        // postMessage handler for Java host and test harness
        window.addEventListener("message", function(event) {
            if (!event.data) return;
            // Java sends SimpleMessage directly (no type field) or typed commands
            if (event.data.role) {
                // SimpleMessage: {role: "AI", message: "..."}
                appendMessage(event.data);
            } else if (event.data.type) {
                switch (event.data.type) {
                    case "updateLiveResponse":
                        updateLiveResponse(event.data.state, event.data.tokPerSec, event.data.chunk);
                        break;
                    case "hideLiveStatus":
                        hideLiveStatus();
                        break;
                    case "appendDiff":
                        appendDiff(event.data.diff);
                        break;
                    case "clearMessages":
                        clearMessages();
                        break;
                }
            }
        });
    </script>
</head>

<body>
    <div id="chat"></div>
</body>
